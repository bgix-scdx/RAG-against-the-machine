[project]
name = "fly-in"
version = "0.1.0"
description = "Make drones fly from one point to another"
requires-python = ">=3.11" 
dependencies = [
    "langchain",
    "torch",
    "langchain-community",
    "langchain-huggingface",
    "bm25>=0.3.11",
    "pydantic>=2.13.0",
    "transformers>=5.17.0",
    "uv>=0.12.15",
    "bm25s>=0.3.11",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "flake8>=7.3.0",
]

[tool.poetry]
package-mode = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.poetry.dependencies]
langchain-text-splitters = "^0.2.0"

[tool.poetry.group.dev.dependencies]
mypy = ">=2.3.0"
flake8 = ">=7.3.0"
